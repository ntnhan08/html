<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>✨ Code Studio Pro · Soạn thảo HTML/CSS/JS</title>
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/eclipse.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/lint/lint.min.css">
    <style>
        /* ===== RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --bg-body: #0b0f19;
            --bg-panel: #151e2c;
            --bg-header: #1a2637;
            --text-primary: #eef2fb;
            --text-secondary: #9aabcf;
            --border-color: #2a3a52;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-soft: rgba(59, 130, 246, 0.15);
            --btn-secondary: #334155;
            --btn-warning: #ef4444;
            --btn-success: #10b981;
            --error-bg: rgba(239, 68, 68, 0.1);
            --preview-bg: #0f172a;
            --shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.5);
            --shadow-sm: 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            --transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 30px;
            
            /* Kích thước chạm tối thiểu */
            --touch-target: 44px;
        }

        body.light {
            --bg-body: #f8fafc;
            --bg-panel: #ffffff;
            --bg-header: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-soft: rgba(59, 130, 246, 0.08);
            --btn-secondary: #64748b;
            --btn-warning: #ef4444;
            --btn-success: #059669;
            --error-bg: #fee2e2;
            --preview-bg: #f1f5f9;
            --shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.1);
            --shadow-sm: 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background 0.3s ease, color 0.2s;
            animation: fadeIn 0.5s ease;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 0 0 var(--primary-soft); } 50% { box-shadow: 0 0 0 4px var(--primary-soft); } }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            backdrop-filter: blur(2px);
        }

        /* ===== MOBILE TABS ===== */
        .mobile-tabs {
            display: none;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            padding: 4px;
        }
        .mobile-tab {
            flex: 1;
            text-align: center;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-primary);
            position: relative;
            letter-spacing: 0.3px;
            border-radius: 40px;
            margin: 2px;
            min-height: var(--touch-target);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-tab.active {
            background: var(--primary);
            color: white;
            transform: scale(1.02);
        }
        .mobile-tab.has-error::after {
            content: '';
            position: absolute;
            top: 8px; right: 8px;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulseGlow 1.5s infinite;
        }

        .main-row {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-preview-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ===== CODE & PREVIEW SECTIONS ===== */
        .code-section, .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            transition: var(--transition);
        }
        .preview-section {
            background: var(--preview-bg);
            border-left: 1px solid var(--border-color);
        }

        .section-header {
            background: var(--bg-header);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            min-height: 58px;
            backdrop-filter: blur(8px);
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-title {
            font-weight: 650;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            font-size: clamp(0.95rem, 4vw, 1.2rem);
        }

        /* Aspect ratio selector */
        .aspect-ratio-selector {
            display: flex;
            gap: 4px;
            background: var(--bg-panel);
            padding: 4px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
        }
        .ratio-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: clamp(0.7rem, 2.5vw, 0.8rem);
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            min-height: 36px;
            min-width: 60px;
        }
        .ratio-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .ratio-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        /* Header actions */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .upload-group { 
            display: flex; 
            gap: 6px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: var(--btn-secondary);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            min-height: var(--touch-target);
        }
        .action-btn svg {
            width: 18px; height: 18px;
            fill: currentColor;
        }
        .action-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px -5px var(--primary-soft);
        }
        .action-btn.auto-fix { 
            background: var(--btn-success); 
            animation: slideUp 0.3s ease;
        }
        .action-btn.auto-fix:hover { 
            background: #059669; 
            box-shadow: 0 8px 15px -5px rgba(16, 185, 129, 0.4);
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: var(--touch-target);
            height: var(--touch-target);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(4px);
            flex-shrink: 0;
        }
        .theme-toggle-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .theme-toggle-btn:hover { 
            background: var(--primary); 
            color: white; 
            transform: rotate(15deg) scale(1.05);
            border-color: transparent;
        }

        /* Tabs */
        .tab-container {
            display: flex;
            background: var(--bg-panel);
            overflow-x: auto;
            overflow-y: hidden;
            border-bottom: 1px solid var(--border-color);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tab-container::-webkit-scrollbar { display: none; }
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: var(--transition);
            white-space: nowrap;
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
            font-size: clamp(0.85rem, 3vw, 1rem);
            min-height: var(--touch-target);
            display: flex;
            align-items: center;
        }
        .tab:hover {
            color: var(--text-primary);
            background: var(--primary-soft);
        }
        .tab.active {
            border-bottom-color: var(--primary);
            background: var(--primary-soft);
            font-weight: 600;
            color: var(--primary);
        }
        .tab.has-error::after {
            content: '';
            position: absolute;
            top: 8px; right: 8px;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulseGlow 1.5s infinite;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }
        .tab-content.active { display: flex; }

        /* CodeMirror */
        .CodeMirror {
            height: 100%;
            font-size: clamp(13px, 4vw, 15px);
            background: var(--bg-panel) !important;
            color: var(--text-primary) !important;
            width: 100% !important;
            transition: background 0.3s;
        }
        .CodeMirror-gutters {
            background: var(--bg-header) !important;
            border-right: 1px solid var(--border-color) !important;
        }

        /* Preview */
        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--preview-bg);
            padding: 12px;
        }
        .preview-frame-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s, transform 0.2s;
            border: 1px solid var(--border-color);
        }
        .preview-frame-wrapper:hover {
            box-shadow: 0 30px 45px -12px rgba(0,0,0,0.4);
        }
        .preview-frame-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            border-radius: var(--radius-lg);
            background: white;
            transition: opacity 0.2s;
        }
        .iframe-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border-radius: var(--radius-lg);
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transition: 0.25s;
            font-weight: 500;
            font-size: 1.1rem;
        }
        .iframe-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Bottom buttons */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
        }
        .button-container.hidden {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: clamp(0.9rem, 3.5vw, 1.05rem);
            box-shadow: var(--shadow-sm);
            color: white;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
            min-height: var(--touch-target);
            min-width: 100px;
            flex: 0 1 auto;
        }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 20px -8px var(--primary); }
        .btn-secondary { background: var(--btn-secondary); }
        .btn-secondary:hover { background: #475569; transform: translateY(-3px); }
        .btn-warning { background: var(--btn-warning); }
        .btn-warning:hover { background: #dc2626; transform: translateY(-3px); }

        /* Error panel */
        .error-panel {
            background: var(--error-bg);
            border-top: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 16px;
            font-size: 0.85rem;
            max-height: 120px;
            overflow-y: auto;
            display: none;
            backdrop-filter: blur(4px);
            animation: slideUp 0.2s ease;
            line-height: 1.5;
        }
        .error-panel.active { display: block; }
        body.light .error-panel { color: #b91c1c; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        /* ===== RESPONSIVE ENHANCEMENTS ===== */
        @media (max-width: 768px) {
            .mobile-tabs { display: flex; }
            .code-section, .preview-section {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                z-index: 1;
                transition: transform 0.3s cubic-bezier(0.2,0,0,1);
            }
            .preview-section { transform: translateX(100%); }
            .code-section.active, .preview-section.active {
                transform: translateX(0);
                z-index: 2;
            }
            .button-container {
                position: fixed;
                bottom: 0; left: 0; width: 100%;
                z-index: 100;
                padding: 12px 12px;
                gap: 8px;
            }
            .btn { 
                flex: 1; 
                padding: 14px 8px; 
                min-width: 0;
                font-size: 0.95rem;
            }
            .section-header {
                padding: 8px 12px;
            }
            .action-btn {
                padding: 8px 12px;
            }
            .aspect-ratio-selector {
                gap: 2px;
            }
            .ratio-btn {
                padding: 5px 8px;
                min-width: 50px;
            }
            /* Đảm bảo nội dung không bị tràn */
            .header-actions {
                gap: 6px;
            }
        }

        /* Tablet và desktop nhỏ */
        @media (min-width: 769px) and (max-width: 1024px) {
            .btn {
                padding: 12px 20px;
            }
            .action-btn {
                padding: 8px 14px;
            }
        }

        /* Đảm bảo các nút có kích thước chạm tối thiểu */
        @media (pointer: coarse) {
            .action-btn, .btn, .tab, .mobile-tab, .ratio-btn, .theme-toggle-btn {
                min-height: var(--touch-target);
            }
        }

        /* Tối ưu cho màn hình rất nhỏ */
        @media (max-width: 480px) {
            .section-title span {
                display: none;
            }
            .section-title::after {
                content: "Code";
            }
            .preview-section .section-title::after {
                content: "Preview";
            }
            .action-btn span {
                display: none;
            }
            .action-btn svg {
                margin: 0;
            }
            .upload-group .action-btn {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="mobile-tabs">
        <div class="mobile-tab active" data-tab="code">✎ Code</div>
        <div class="mobile-tab" data-tab="preview">👁️ Kết quả</div>
    </div>

    <div class="main-row">
        <div class="editor-preview-container">
            <!-- CODE SECTION -->
            <div class="code-section active">
                <div class="section-header">
                    <div class="section-title"><span>📄 Mã nguồn</span></div>
                    <div class="header-actions">
                        <div class="upload-group">
                            <button class="action-btn" id="uploadHtmlBtn">
                                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm0 18H6V4h7v5h5v11zM8 15h8v2H8v-2zm0-4h8v2H8v-2z"/></svg>
                                <span>HTML</span>
                            </button>
                            <button class="action-btn" id="uploadCssBtn">
                                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm0 18H6V4h7v5h5v11zM8 15h8v2H8v-2z"/></svg>
                                <span>CSS</span>
                            </button>
                            <button class="action-btn" id="uploadJsBtn">
                                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm0 18H6V4h7v5h5v11zM8 15h8v2H8v-2z"/></svg>
                                <span>JS</span>
                            </button>
                        </div>
                        <button class="action-btn auto-fix" id="autoFixHtmlBtn">
                            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                            <span>Sửa</span>
                        </button>
                        <button class="theme-toggle-btn" id="themeToggleBtn"></button>
                    </div>
                </div>
                <div class="tab-container">
                    <div class="tab active" data-tab="html">HTML</div>
                    <div class="tab" data-tab="css">CSS</div>
                    <div class="tab" data-tab="js">JavaScript</div>
                </div>
                <div class="tab-content active" id="html-content">
                    <textarea id="html-code"><!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Trang của tôi</title></head>
<body><h1>Xin chào!</h1><p>Đây là trình soạn thảo HTML.</p></body>
</html></textarea>
                </div>
                <div class="tab-content" id="css-content">
                    <textarea id="css-code"></textarea>
                </div>
                <div class="tab-content" id="js-content">
                    <textarea id="js-code"></textarea>
                </div>
                <div class="error-panel" id="error-panel"></div>
            </div>

            <!-- PREVIEW SECTION -->
            <div class="preview-section">
                <div class="section-header">
                    <div class="section-title"><span>🖥️ Kết quả trực tiếp</span></div>
                    <div class="aspect-ratio-selector" id="aspectRatioSelector">
                        <button class="ratio-btn active" data-ratio="16:9">16:9</button>
                        <button class="ratio-btn" data-ratio="16:10">16:10</button>
                        <button class="ratio-btn" data-ratio="4:3">4:3</button>
                        <button class="ratio-btn" data-ratio="1:1">1:1</button>
                        <button class="ratio-btn" data-ratio="9:16">9:16</button>
                        <button class="ratio-btn" data-ratio="21:9">21:9</button>
                    </div>
                </div>
                <div class="preview-container">
                    <div class="preview-frame-wrapper" id="frameWrapper" style="aspect-ratio:16/9">
                        <div class="iframe-overlay" id="iframe-overlay">
                            <span>✨ Đang tải...</span>
                        </div>
                        <iframe id="preview-frame"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="button-container" id="globalButtonBar">
        <button class="btn btn-primary" id="run-btn">▶ Chạy</button>
        <button class="btn btn-secondary" id="clear-btn">🗑️ Xóa</button>
        <button class="btn btn-warning" id="reset-btn">↻ Đặt lại</button>
    </div>
</div>

<input type="file" id="htmlFileInput" accept=".html,.htm" style="display:none">
<input type="file" id="cssFileInput" accept=".css" style="display:none">
<input type="file" id="jsFileInput" accept=".js" style="display:none">

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/hint/xml-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/hint/css-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/hint/javascript-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/hint/html-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/lint/javascript-lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/lint/css-lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.13.6/jshint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/csslint/1.0.5/csslint.min.js"></script>

<script>
    (function(){
        "use strict";

        // ----- Theme & Icons -----
        const moonIcon = `<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>`;
        const sunIcon = `<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2v-2H2v2zm18 0h2v-2h-2v2zm-5-7.24V2h-2v3.76l2-2zM9 2H7v3.76l2-2V2zm10.24 5l-2 2 2 2 2-2-2-2zM5.76 7l-2 2 2 2 2-2-2-2zM12 18c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z"/></svg>`;
        const body = document.body;
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        let currentTheme = 'dark';
        const editorThemes = { dark: 'material-darker', light: 'eclipse' };

        // ----- Editors -----
        const htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-code'), {
            mode: 'htmlmixed', theme: editorThemes.dark, lineNumbers: true, autoCloseTags: true,
            matchTags: true, lineWrapping: true, foldGutter: true, gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
            extraKeys: { "Ctrl-Space": "autocomplete" }
        });
        const cssEditor = CodeMirror.fromTextArea(document.getElementById('css-code'), {
            mode: 'css', theme: editorThemes.dark, lineNumbers: true, lineWrapping: true,
            foldGutter: true, gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter", "CodeMirror-lint-markers"],
            lint: { getAnnotations: CodeMirror.lint.css, async: true }
        });
        const jsEditor = CodeMirror.fromTextArea(document.getElementById('js-code'), {
            mode: 'javascript', theme: editorThemes.dark, lineNumbers: true, lineWrapping: true,
            foldGutter: true, gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter", "CodeMirror-lint-markers"],
            lint: { getAnnotations: CodeMirror.lint.javascript, options: { esversion: 8 } }
        });
        cssEditor.setValue(''); jsEditor.setValue('');

        function setTheme(theme) {
            body.classList.remove('light', 'dark'); body.classList.add(theme);
            const cmTheme = editorThemes[theme];
            [htmlEditor, cssEditor, jsEditor].forEach(ed => ed.setOption('theme', cmTheme));
            currentTheme = theme;
            themeToggleBtn.innerHTML = theme === 'dark' ? moonIcon : sunIcon;
        }
        themeToggleBtn.addEventListener('click', ()=> setTheme(currentTheme==='dark'?'light':'dark'));
        setTheme('dark');

        // ----- Sửa HTML + định dạng đẹp -----
        function autoFixHTML() {
            let html = htmlEditor.getValue();
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const serializer = new XMLSerializer();
                let fixed = serializer.serializeToString(doc);
                fixed = formatHTML(fixed);
                htmlEditor.setValue(fixed);
                runCode();
                showTemporaryMessage('✅ HTML đã được sửa lỗi và định dạng đẹp!');
            } catch (e) {
                alert('Không thể sửa HTML: ' + e.message);
            }
        }

        function formatHTML(html) {
            let doctype = '';
            let rest = html;
            const doctypeMatch = html.match(/<!DOCTYPE[^>]*>/i);
            if (doctypeMatch) {
                doctype = doctypeMatch[0];
                rest = html.substring(doctypeMatch.index + doctypeMatch[0].length).trim();
            }
            const voidElements = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
            let indentLevel = 0;
            const indentSize = 2;
            let formatted = '';
            const tokens = rest.split(/(<[^>]+>)/g).filter(t => t.trim().length > 0);
            for (let token of tokens) {
                if (token.startsWith('<')) {
                    const isClosing = token.startsWith('</');
                    const isSelfClosing = token.endsWith('/>');
                    const tagMatch = token.match(/<\/?([a-zA-Z0-9-]+)/);
                    const tagName = tagMatch ? tagMatch[1].toLowerCase() : '';
                    const isVoid = voidElements.has(tagName);
                    if (isClosing) {
                        indentLevel = Math.max(0, indentLevel - 1);
                        formatted += ' '.repeat(indentLevel * indentSize) + token + '\n';
                    } else {
                        formatted += ' '.repeat(indentLevel * indentSize) + token + '\n';
                        if (!isVoid && !isSelfClosing) indentLevel++;
                    }
                } else {
                    const trimmed = token.trim();
                    if (trimmed) formatted += ' '.repeat(indentLevel * indentSize) + trimmed + '\n';
                }
            }
            return doctype ? doctype + '\n' + formatted.trim() : formatted.trim();
        }

        function showTemporaryMessage(msg) {
            const panel = document.getElementById('error-panel');
            const originalContent = panel.innerHTML;
            const originalActive = panel.classList.contains('active');
            panel.innerHTML = `<div style="color: #10b981; padding: 8px; font-weight:500;">${msg}</div>`;
            panel.classList.add('active');
            setTimeout(() => {
                panel.innerHTML = originalContent;
                if (!originalActive) panel.classList.remove('active');
            }, 2000);
        }

        document.getElementById('autoFixHtmlBtn').addEventListener('click', autoFixHTML);

        // ----- Preview & Run -----
        const previewFrame = document.getElementById('preview-frame');
        const overlay = document.getElementById('iframe-overlay');
        const frameWrapper = document.getElementById('frameWrapper');
        const runBtn = document.getElementById('run-btn');
        const clearBtn = document.getElementById('clear-btn');
        const resetBtn = document.getElementById('reset-btn');
        const errorPanel = document.getElementById('error-panel');
        const mobileTabs = document.querySelectorAll('.mobile-tab');
        const codeSection = document.querySelector('.code-section');
        const previewSection = document.querySelector('.preview-section');
        const globalButtonBar = document.getElementById('globalButtonBar');

        function runCode() {
            overlay.classList.add('active');
            const html = htmlEditor.getValue();
            const css = cssEditor.getValue();
            const js = jsEditor.getValue();
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`);
            doc.close();
            setTimeout(() => overlay.classList.remove('active'), 350);
            checkErrors();
        }

        function checkErrors() {
            const cssMarks = cssEditor.state.lint?.marked || [];
            const jsMarks = jsEditor.state.lint?.marked || [];
            const errors = [
                ...cssMarks.map(m => ({ type: 'CSS', line: m.from.line + 1, msg: m.message })),
                ...jsMarks.map(m => ({ type: 'JS', line: m.from.line + 1, msg: m.message }))
            ];
            const count = errors.length;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('has-error'));
            if (cssMarks.length) document.querySelector('.tab[data-tab="css"]')?.classList.add('has-error');
            if (jsMarks.length) document.querySelector('.tab[data-tab="js"]')?.classList.add('has-error');
            errorPanel.classList.toggle('active', count > 0);
            if (count) {
                errorPanel.innerHTML = errors.map(e => `<div class="error-item">[${e.type}] dòng ${e.line}: ${e.msg}</div>`).join('');
            }
        }

        runBtn.addEventListener('click', runCode);
        clearBtn.addEventListener('click', ()=> {
            if(confirm('Xóa toàn bộ code?')) { htmlEditor.setValue(''); cssEditor.setValue(''); jsEditor.setValue(''); runCode(); }
        });
        resetBtn.addEventListener('click', ()=> {
            if(confirm('Đặt lại code mẫu?')) {
                htmlEditor.setValue(`<!DOCTYPE html>\n<html>\n<head><meta charset="UTF-8"><title>Trang của tôi</title></head>\n<body><h1>Xin chào!</h1><p>Đây là trình soạn thảo HTML.</p></body>\n</html>`);
                cssEditor.setValue(''); jsEditor.setValue(''); runCode();
            }
        });

        // Mobile & UI
        function toggleButtonBar() {
            if(window.innerWidth<=768) globalButtonBar.classList.toggle('hidden', previewSection.classList.contains('active'));
            else globalButtonBar.classList.remove('hidden');
        }
        mobileTabs.forEach(t=> t.addEventListener('click', ()=>{
            mobileTabs.forEach(x=>x.classList.remove('active')); t.classList.add('active');
            const type = t.dataset.tab;
            codeSection.classList.toggle('active', type==='code');
            previewSection.classList.toggle('active', type==='preview');
            toggleButtonBar();
        }));
        window.addEventListener('resize', ()=>{ 
            toggleButtonBar(); 
            [htmlEditor,cssEditor,jsEditor].forEach(e=> e.refresh()); 
        });
        document.querySelectorAll('.tab').forEach(t=> t.addEventListener('click', ()=>{
            document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
            document.getElementById(t.dataset.tab+'-content').classList.add('active');
            setTimeout(()=>{ if(t.dataset.tab==='html') htmlEditor.refresh(); else if(t.dataset.tab==='css') cssEditor.refresh(); else jsEditor.refresh(); },20);
        }));

        // Tỉ lệ khung hình
        document.querySelectorAll('.ratio-btn').forEach(b=> b.addEventListener('click', ()=>{
            document.querySelectorAll('.ratio-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
            const [w,h] = b.dataset.ratio.split(':').map(Number);
            frameWrapper.style.aspectRatio = `${w}/${h}`;
        }));

        // Upload file
        function readFile(file, editor) { if(!file) return; const r = new FileReader(); r.onload = e=> { editor.setValue(e.target.result); runCode(); }; r.readAsText(file); }
        document.getElementById('htmlFileInput').addEventListener('change', e=> readFile(e.target.files[0], htmlEditor));
        document.getElementById('cssFileInput').addEventListener('change', e=> readFile(e.target.files[0], cssEditor));
        document.getElementById('jsFileInput').addEventListener('change', e=> readFile(e.target.files[0], jsEditor));
        document.getElementById('uploadHtmlBtn').addEventListener('click', ()=> document.getElementById('htmlFileInput').click());
        document.getElementById('uploadCssBtn').addEventListener('click', ()=> document.getElementById('cssFileInput').click());
        document.getElementById('uploadJsBtn').addEventListener('click', ()=> document.getElementById('jsFileInput').click());

        window.addEventListener('DOMContentLoaded', ()=>{
            runCode();
            toggleButtonBar();
        });
    })();
</script>
</body>
</html>
